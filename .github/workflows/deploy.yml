# Build the site and publish it to GitHub Pages on every push to main.
#
# Two things about this project make it easy to host and are worth not breaking:
# the router is hash-based, so no server rewrite rules are needed for /about and
# friends, and vite.config.mjs sets base to './', so the build works from the
# /<repo>/ subpath a project Pages site is served from.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # The photographs are named in lowercase with hyphens precisely so this
      # step, on a case-sensitive filesystem, serves what the site asks for.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
